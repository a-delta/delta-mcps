<!-- @note
COMPARISON MATRIX — describes itself. A feature table with tick / cross /
partial cells. The highlighted column uses .col-hot (and a .hot header).
Rows reveal one at a time via data-frag.
-->
<section class="slide" data-section="2" data-file="examples/matrix.html">
  <div class="slide-inner">
    <div class="kicker">Component · comparison matrix</div>
    <h2>This is a comparison matrix<span class="dot">.</span></h2>
    <table class="matrix">
      <thead>
        <tr><th>Cell type</th><th>Column A</th><th>Column B</th><th class="hot">Highlighted</th></tr>
      </thead>
      <tbody>
        <tr class="frag" data-frag><th>Yes cell</th><td><span class="yes">✓</span></td><td><span class="no">✕</span></td><td class="col-hot"><span class="yes">✓</span></td></tr>
        <tr class="frag" data-frag><th>No cell</th><td><span class="no">✕</span></td><td><span class="no">✕</span></td><td class="col-hot"><span class="yes">✓</span></td></tr>
        <tr class="frag" data-frag><th>Partial cell</th><td><span class="partial">Some</span></td><td><span class="partial">Trial</span></td><td class="col-hot"><span class="yes">✓</span></td></tr>
        <tr class="frag" data-frag><th>Rows use data-frag</th><td><span class="no">✕</span></td><td><span class="partial">Basic</span></td><td class="col-hot"><span class="yes">✓</span></td></tr>
        <tr class="frag" data-frag><th>.col-hot column</th><td><span class="yes">✓</span></td><td><span class="no">✕</span></td><td class="col-hot"><span class="yes">✓</span></td></tr>
      </tbody>
    </table>
  </div>
</section>
