<!-- @note
PUNCH — describes itself. A headline-alone hook: a muted setup line, then
a huge response in brand green, then a small sub-line. Both the response
and sub reveal via data-frag.
-->
<section class="slide punch" data-section="2" data-file="examples/punch.html">
  <div class="slide-inner">
    <p class="punch-line">This is the punch slide…</p>
    <p class="punch-response frag" data-frag>One big idea<span class="dot">.</span></p>
    <p class="punch-sub frag" data-frag>The response lands huge in brand green; this sub-line stays small so the headline dominates the room.</p>
  </div>
</section>
