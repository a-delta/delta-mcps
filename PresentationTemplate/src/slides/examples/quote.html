<!-- @note
PULL QUOTE — describes itself. A big quotation with an oversized quote
mark, an emphasised phrase (.pq-em, brand green), and an attribution that
reveals after the line via data-frag.
-->
<section class="slide" data-section="2" data-file="examples/quote.html">
  <figure class="slide-inner pullquote">
    <span class="pq-mark" aria-hidden="true">&ldquo;</span>
    <blockquote>This is a pull quote — a large line of type with one <span class="pq-em">emphasised phrase</span> and an attribution below.</blockquote>
    <figcaption class="frag" data-frag>
      <span class="pq-avatar">👤</span>
      <span><b>The attribution</b> &middot; revealed on the next press</span>
    </figcaption>
  </figure>
</section>
