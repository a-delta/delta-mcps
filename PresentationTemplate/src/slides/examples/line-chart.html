<!-- @note
LINE CHART — a scene describing itself. The trend line draws itself on,
the area beneath fades in, then a dot pops on each point. The data lives
in the inline JSON block; scenes.js builds the SVG (axes, grid, labels).
Edit points / min / max there.
-->
<section class="slide scene-slide" data-section="1" data-scene="line" data-file="examples/line-chart.html">
  <div class="scene">
    <div class="graph-head">
      <div class="kicker">Scene · line chart</div>
      <h2>This trend draws itself on<span class="dot">.</span></h2>
      <p class="lead">Points come from an inline JSON block; the line animates, the area fills, then the dots pop in order.</p>
    </div>
    <div class="scene-area">
      <div class="line-chart"></div>
      <!-- Chart definition consumed by scenes.js -->
      <script type="application/json" class="line-data">
      {
        "min": 0,
        "max": 100,
        "points": [
          { "x": "Jan", "y": 18 },
          { "x": "Feb", "y": 27 },
          { "x": "Mar", "y": 24 },
          { "x": "Apr", "y": 41 },
          { "x": "May", "y": 55 },
          { "x": "Jun", "y": 72 },
          { "x": "Jul", "y": 88 }
        ]
      }
      </script>
    </div>
    <div class="scan-tag"><span class="pulse"></span>line + dots replay on every visit</div>
  </div>
</section>
