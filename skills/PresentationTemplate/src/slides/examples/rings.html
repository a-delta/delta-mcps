<!-- @note
RADIAL RINGS — a scene describing itself. Each .ring[data-pct] sweeps
its SVG arc to that percentage while the centre number counts up to
data-count (defaults to the pct). Modifier classes set the arc colour.
-->
<section class="slide scene-slide" data-section="1" data-scene="rings" data-file="examples/rings.html">
  <div class="scene">
    <div class="graph-head">
      <div class="kicker">Scene · radial rings</div>
      <h2>These dials sweep to a percentage<span class="dot">.</span></h2>
      <p class="lead">The arc fills to <code>data-pct</code> and the centre number counts up. Three colour modifiers shown below.</p>
    </div>
    <div class="scene-area">
      <div class="rings">
        <div class="ring good" data-pct="92" data-count="92">
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="42" stroke-width="9"/><circle class="ring-arc" cx="50" cy="50" r="42" stroke-width="9"/></svg>
            <div class="ring-num"><span class="val">0</span>%</div>
          </div>
          <div class="ring-lbl">.good</div>
          <div class="ring-sub">pct=92, arc nearly full</div>
        </div>
        <div class="ring" data-pct="78" data-count="78">
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="42" stroke-width="9"/><circle class="ring-arc" cx="50" cy="50" r="42" stroke-width="9"/></svg>
            <div class="ring-num"><span class="val">0</span>%</div>
          </div>
          <div class="ring-lbl">default</div>
          <div class="ring-sub">pct=78, brand blue arc</div>
        </div>
        <div class="ring warn" data-pct="46" data-count="46">
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="42" stroke-width="9"/><circle class="ring-arc" cx="50" cy="50" r="42" stroke-width="9"/></svg>
            <div class="ring-num"><span class="val">0</span>%</div>
          </div>
          <div class="ring-lbl">.warn</div>
          <div class="ring-sub">pct=46, under halfway</div>
        </div>
      </div>
    </div>
    <div class="scan-tag"><span class="pulse"></span>arc + number replay on every visit</div>
  </div>
</section>
