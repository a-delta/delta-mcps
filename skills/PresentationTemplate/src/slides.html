<!-- ============================================================
     SLIDE MANIFEST — the deck's running order lives HERE, and
     only here. Each line inlines one <section> from slides/<section>/.

     Reorder a slide  → move its line.
     Insert a slide   → add a line + a file in the right section folder.
     Remove a slide   → delete its line (leave the file, or delete it).

     Filenames are named by TOPIC, never by number — so nothing has
     to be renumbered when the order changes, and two branches only
     conflict if they touch the same slide (or this one line-list).

     build.js resolves each @build:inline relative to src/, recursing
     into the section folders. Slide identity at runtime comes from DOM
     order + data-section — not from this file.
     ============================================================ -->
